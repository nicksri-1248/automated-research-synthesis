name: Build and Push Jenkins Image

# Builds the custom Jenkins image (Dockerfile.jenkins) on a GitHub-hosted
# runner and pushes it to Azure Container Registry. Used because ACR Tasks
# (cloud build) is disabled on the target subscription, and no local Docker
# is available on the deploying machine.

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "Dockerfile.jenkins"
      - ".github/workflows/build-jenkins-image.yml"

env:
  IMAGE_NAME: custom-jenkins
  IMAGE_TAG: lts-git-configured

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.jenkins
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
