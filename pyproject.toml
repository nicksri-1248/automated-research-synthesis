[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-research-synthesis"
version = "0.1.0"
description = "Automated research report generation system"
readme = "README.md"
authors = [
    { name = "Nikhil Srivastava", email = "nicksri1248@proton.me" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "langchain-anthropic>=1.5.6",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.6",
    "langchain-google-genai>=4.3.4",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.5.2",
    "langgraph>=1.2.11",
    "structlog>=26.1.0",
    "tavily-python>=0.7.27",
    "wikipedia>=1.4.0",
    "python-docx",
    "reportlab",
    "fastapi",
    "uvicorn",
    "jinja2",
    "httpx",
    "aiofiles",
    "sqlalchemy",
    "bcrypt==3.2.2",
    "passlib==1.7.4",
    "python-multipart",
]

[tool.setuptools.packages.find]
include = ["research_and_analyst*"]